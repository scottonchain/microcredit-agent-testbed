name: Inventory test USDC without signing
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/circle-faucet.yml"
      - "scripts/test_wallet_inventory.mjs"
      - "scripts/acp_trace_readonly.mjs"
      - "scripts/acp-trace-abi.json"
permissions:
  contents: read
jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned read-only runtime
        run: npm install --prefix /tmp/test-wallet-inventory --no-audit --no-fund ethers@6.15.0
      - name: Inventory both test networks and the recorded cohort
        run: |
          cp -R scripts experiments /tmp/test-wallet-inventory/
          cd /tmp/test-wallet-inventory
          node scripts/test_wallet_inventory.mjs
      - name: Reproduce the one historical ACP trace without signing
        run: |
          cd /tmp/test-wallet-inventory
          node scripts/acp_trace_readonly.mjs
      - name: Preserve public balances
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-wallet-inventory
          path: |
            /tmp/test-wallet-inventory/test-wallet-inventory.json
            /tmp/test-wallet-inventory/acp-trace-readonly.json
          if-no-files-found: error
