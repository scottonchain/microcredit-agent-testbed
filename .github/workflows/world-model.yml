name: World model integrity
on:
  pull_request:
    paths: ['world-model/**', 'CLAUDE.md', '.github/workflows/world-model.yml']
  push:
    branches: [main]
    paths: ['world-model/**', 'CLAUDE.md', '.github/workflows/world-model.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r world-model/requirements.txt
      - run: python world-model/validate.py --check-schema
      - run: python -m unittest discover -s world-model -p 'test_*.py'
      - name: Public-content check
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          bash world-model/check-public-content.sh --range "$base..HEAD"
