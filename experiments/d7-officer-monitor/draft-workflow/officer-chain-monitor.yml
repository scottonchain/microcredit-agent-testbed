# NOT ACTIVE. This file lives outside .github/workflows on purpose, and every job below is also disabled with `if: ${{ false }}`.
# It is a draft for review only. To activate it the owners must (1) accept the PR that adds it, (2) name its operating owner,
# (3) copy it to .github/workflows/ in a separate reviewed change and (4) remove the `if: ${{ false }}` lines. Until then nothing runs.
#
# What it would do: every 15 minutes read the Base Sepolia CreditDesk pending queue (chain symptoms only) and post one fixed-shape,
# validated status comment to board 462. It never sees the officer log, heartbeat or runtime hash, holds no wallet secret and no signer,
# and is an auxiliary monitor only: scheduled runs can be delayed or dropped and a schedule is paused after a long period without
# repository activity, and a job cannot detect its own missed dispatch, so something outside it must watch for missing receipts.
# Dedup (DEDUP_DESIGN.md): the send job reads the board's own comments, and decide-post.mjs posts only when the status changed or a repeat/receipt is
# due. It is still a draft: the independent watcher of missing receipts (O6) must exist before activation, and nothing here has run.
# Shell: no step sets `shell:`, so each `run` is GitHub's default `bash -e {0}` (errexit, no pipefail). Every command whose failure matters
# therefore stands alone on its own line, nothing important is read through a pipe, and no failure is swallowed. The one pipe left is the final
# jq-into-the-API post, where the API call is the last command and an empty body from a failed jq is rejected by the API. Adding
# `shell: bash` (which adds pipefail) is an option for the O5 reviewers.
name: Officer chain monitor (draft, inactive)
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
concurrency:
  group: officer-chain-monitor
  cancel-in-progress: false
permissions: {}
jobs:
  snapshot:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the chain and build the status comment (read-only, no secrets)
        run: |
          set +e
          node experiments/d7-officer-monitor/run-chain-monitor.mjs experiments/d7-officer-monitor/monitor-config.example.json > status-comment.md
          code=$?
          # exit 2 is an ALERT comment that must still be sent; any other non-zero exit (3 = invalid config or message) fails the job visibly
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "monitor failed with exit $code" >&2; exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: status-comment
          path: status-comment.md
          if-no-files-found: error
          retention-days: 1
  send:
    if: ${{ false }}
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: status-comment
      - name: Re-validate the comment (nothing else is ever sent)
        run: |
          node experiments/d7-officer-monitor/validate-comment.mjs status-comment.md
      - name: Read the board state (read-only; the comment count first, then the whole list)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/issues/462" --jq '.comments' > count.txt
          # a deleted account has no user object: its login becomes an empty string (some other author), not a failure
          gh api --paginate "repos/$REPO/issues/462/comments?per_page=100" --jq '.[] | {id: .id, created_at: .created_at, login: (.user.login // ""), body: (if .user.login == "github-actions[bot]" then .body else null end)}' > comments.ndjson
          jq -s '.' comments.ndjson > comments.json
      - name: Decide whether this run posts (exit 3 fails the job visibly)
        id: decide
        run: |
          node experiments/d7-officer-monitor/decide-post.mjs status-comment.md comments.json count.txt >> "$GITHUB_OUTPUT"
      - name: Post to board 462 (only when the decision says post)
        if: ${{ steps.decide.outputs.post == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # post the exact validated bytes (command substitution would strip the trailing newline the validator requires)
          jq -Rs '{body: .}' status-comment.md | gh api "repos/$REPO/issues/462/comments" --input -
